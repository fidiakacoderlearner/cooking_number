<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e6">
<meta name="description" content="Cooking Number - customers keep coming in. Cook the number they ordered and serve it before they lose patience.">
<title>Cooking Number</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="assets/placeholder/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/animations.css">
</head>
<body data-screen="menu">

<!-- ============================= MENU ============================= -->
<section class="screen screen--menu" data-screen-name="menu">
  <header class="menu__header">
    <img class="menu__hat" src="assets/placeholder/chef-hat.webp" alt="" width="96" height="96">
    <h1 class="menu__title" data-i18n="app.title">Cooking Number</h1>
    <p class="menu__tagline" data-i18n="app.tagline">Cook the number. Serve the customer.</p>
  </header>

  <div class="menu__modes" role="group" aria-labelledby="mode-heading">
    <h2 class="menu__heading" id="mode-heading" data-i18n="menu.chooseMode">Choose a mode</h2>

    <button class="mode-card" data-mode="easy" type="button">
      <span class="mode-card__name" data-i18n="mode.easy">Easy</span>
      <span class="mode-card__grade" data-i18n="mode.grade7">Grade 7</span>
      <span class="mode-card__detail" data-i18n="mode.easyDetail">Integers, including negatives</span>
      <span class="mode-card__ops" data-mode-ops="easy" aria-hidden="true"></span>
    </button>

    <button class="mode-card" data-mode="medium" type="button">
      <span class="mode-card__name" data-i18n="mode.medium">Medium</span>
      <span class="mode-card__grade" data-i18n="mode.grade8">Grade 8</span>
      <span class="mode-card__detail" data-i18n="mode.mediumDetail">Fractions join the menu</span>
      <span class="mode-card__ops" data-mode-ops="medium" aria-hidden="true"></span>
    </button>

    <button class="mode-card" data-mode="hard" type="button">
      <span class="mode-card__name" data-i18n="mode.hard">Hard</span>
      <span class="mode-card__grade" data-i18n="mode.grade9">Grade 9</span>
      <span class="mode-card__detail" data-i18n="mode.hardDetail">Powers and square roots</span>
      <span class="mode-card__ops" data-mode-ops="hard" aria-hidden="true"></span>
    </button>
  </div>

  <footer class="menu__footer">
    <button class="lang-toggle" type="button" data-action="toggle-lang" data-i18n-aria="action.toggleLang" aria-label="Change language">
      <span data-i18n="menu.language">Language</span>: <strong data-lang-current>EN</strong>
    </button>
  </footer>
</section>

<!-- ============================= LEVEL SELECT ============================= -->
<section class="screen screen--levels" data-screen-name="levels" hidden>
  <header class="levels__header">
    <button class="btn btn--ghost" type="button" data-action="back-to-menu">
      <span aria-hidden="true">&larr;</span> <span data-i18n="common.back">Back</span>
    </button>
    <h2 class="levels__title" data-mode-title>Easy</h2>
  </header>

  <ol class="levels__grid" data-level-grid></ol>
</section>

<!-- ============================= GAME ============================= -->
<section class="screen screen--game" data-screen-name="game" hidden>

  <header class="hud">
    <button class="hud__quit" type="button" data-action="back-to-menu"
            data-i18n-aria="action.backToMenu" aria-label="Back to menu" title="Back to menu">&#9776;</button>
    <div class="hud__cell hud__cell--level">
      <span class="hud__label" data-i18n="hud.level">Level</span>
      <span class="hud__value" data-hud-level>1</span>
    </div>
    <div class="hud__cell hud__cell--served">
      <span class="hud__label" data-i18n="hud.served">Served</span>
      <span class="hud__value" data-hud-served>0/0</span>
    </div>
    <div class="hud__cell hud__cell--score">
      <span class="hud__label" data-i18n="hud.score">Score</span>
      <span class="hud__value" data-hud-score>0</span>
    </div>
    <div class="hud__progress" aria-hidden="true">
      <div class="hud__progress-fill" data-hud-progress></div>
    </div>
  </header>

  <section class="queue" data-queue aria-label="Customers">
    <div class="queue__strip" data-queue-strip></div>
    <p class="queue__next" data-queue-next></p>
  </section>

  <div class="stand">
    <div class="counter">
      <div class="counter__plate" data-draggable="true">
        <img class="counter__plate-img" src="assets/placeholder/plate.webp" alt="" width="200" height="120">
        <span class="counter__plate-value" data-plate-value></span>
        <span class="counter__plate-hint" data-i18n="stand.dropHere">Drag the dish to a customer</span>
      </div>
    </div>

    <div class="workspace" data-workspace>
      <div class="workspace__line" data-workspace-line></div>
    <p class="workspace__empty" data-workspace-empty data-i18n="work.dragHint">
    Tap a customer, then build their number.
  </p>
    </div>

    <div class="feedback" data-feedback hidden>
      <p class="feedback__text" data-feedback-text></p>
    </div>

    <div class="controls">
      <button class="btn btn--serve" type="button" data-action="serve" disabled>
        <span data-i18n="action.serve">Serve</span>
      </button>
      <button class="btn btn--ghost" type="button" data-action="undo">
        <span data-i18n="action.undo">Undo</span>
      </button>
      <button class="btn btn--ghost" type="button" data-action="clear">
        <span data-i18n="action.clear">Clear</span>
      </button>
    </div>
  </div>

  <div class="rack">
    <div class="rack__numbers" data-rack-numbers></div>
    <div class="rack__operators" data-rack-operators></div>
  </div>
</section>

<!-- ============================= OVERLAYS ============================= -->
<div class="overlay" data-overlay="level" hidden>
  <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="overlay-level-title">
    <h2 class="overlay__title" id="overlay-level-title" data-i18n="overlay.levelDone">Level complete!</h2>
    <p class="overlay__text" data-overlay-summary></p>
    <p class="overlay__text" data-overlay-score></p>
    <div class="overlay__actions">
      <button class="btn btn--primary" type="button" data-action="next-level">
        <span data-i18n="overlay.nextLevel">Next level</span>
      </button>
      <button class="btn btn--ghost" type="button" data-action="back-to-menu">
        <span data-i18n="overlay.menu">Menu</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" data-toast hidden></div>

<!-- ============================= CONFIRM ============================= -->
<!-- Asked only when a customer is swapped out from under a half-built dish, so
     that one tap cannot cost real work. The clock is stopped while it is open. -->
<div class="overlay" data-overlay="confirm" hidden>
  <div class="overlay__card" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <h2 class="overlay__title" id="confirm-title" data-i18n="confirm.switchTitle">Leave this dish?</h2>
    <p class="overlay__text" id="confirm-body" data-confirm-body data-i18n="confirm.switchBody">
    Cooking for another customer throws this one away.
    </p>
    <div class="overlay__actions">
      <button class="btn btn--primary" type="button" data-action="confirm-stay" data-confirm="stay">
        <span data-i18n="confirm.stay">Keep cooking</span>
      </button>
      <button class="btn btn--ghost" type="button" data-action="confirm-leave">
        <span data-i18n="confirm.leave">Switch anyway</span>
      </button>
    </div>
  </div>
</div>

<script src="vendor/interact.min.js"></script>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
